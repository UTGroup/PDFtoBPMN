# 5. СОБЫТИЯ
# ─────────────────────────────────────────────────────────────────────────
events:
  - id: EVT-DELAY-DETECTED
    name: Зафиксирована задержка
    sources: [SYS-MER-OPS, FEED-AFTN-MVT, FEED-SITA]
    consumers_dp: [A1, B1]  # v2.1: то же событие порождает обе петли A и B
  - id: EVT-DELAY-CLASSIFIED
    name: Задержке присвоен IATA-код
    sources: [DP A2 output]
    consumers_dp: [A3, A4]
  # v2.1: новый основной триггер B-петли (вместо EVT-DISRUPT-TRIGGER)
  - id: EVT-DEVIATION-DETECTED
    name: Прогноз/факт отклонения от планового времени (любой рейс, без порога)
    sources: [SYS-MER-OPS, FEED-AFTN-MVT, FEED-SITA, FEED-METEO]
    consumers_dp: [B1, B2]
    note: основной триггер B-петли в v2.1 (рутинно, сотни раз в сутки)
  # v2.1: SLA-таймеры из КД-РД-Б1.041-04 как события
  - id: EVT-SLA-T-MINUS-6H
    name: T-6h до СОВ — ожидаются ремарки DEGR/CVIP/PDTS
    sources: [SYS-LEONARDO]
    consumers_dp: [B2]
    anchor: КД-РД-Б1.041-04 (изм.32)
  - id: EVT-SLA-T-MINUS-3H
    name: T-3h/T-2h до СОВ — протокол по трансферным паксам
    sources: [SYS-LEONARDO, SYS-DCS-ASTRA]
    consumers_dp: [B2]
    anchor: КД-РД-Б1.041-04 (изм.32)
  - id: EVT-SLA-T-PLUS-1H
    name: T+1h после фактической задержки — контроль ФАП-82 через KYFO
    sources: [SYS-KYFO]
    consumers_dp: [B2]
    anchor: КД-РД-Б1.041-04 (изм.32)
  - id: EVT-FLIGHT-3SYS-DESYNC
    name: Расхождение состояния рейса между АСБ Leonardo, DCS Astra и Meridian.OPS
    sources: [SYS-LEONARDO, SYS-DCS-ASTRA, SYS-MER-OPS]
    consumers_dp: [B2]
    note: gap-06/GAP-10 — основа для CDC или event-bus
  - id: EVT-SCENARIO-CHOSEN
    name: Выбрано окончательное решение по отклонению
    sources: [DP B2 output]
    consumers_dp: [B3, исполнители]
  - id: EVT-ESCALATE-HIERARCHY
