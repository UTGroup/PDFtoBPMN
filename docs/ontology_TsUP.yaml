master_data_pointers:
  aircraft:
    source: SYS-MER-NET (борт.номер, тип ВС, конфигурация, MEL-статус)
  crews:
    source: SYS-MER-CREW (ID экипажа, категория, медосмотр, рабочее время)
  airports:
    source: SYS-CBRS + Meridian.Nav (IATA/ICAO, режимы, слоты, инфраструктура)
  routes:
    source: SYS-MER-NAV (FPL, запасные а/д, топливо)
  customers:
    source: ООП ЦУП (заказчики, заявки)
