# Онтология ЦУП (AS-IS) — справочники и связи
# Артефакт §7.1 шага 4 из input2/ЦУП_md/ANALYSIS_AS-IS_RCA_и_Сбойные.md
# Назначение: единая модель сущностей для ИИ-ассистента ЦУП.
# Принцип: дословное соответствие нормативке (РД-Б8.005-09, КД-ДП-Б8.007-05,
# КД-РГ-147(148)-08, РИ-М1.016-08, РИ-Б8.014-07, РГ-128-06).

meta:
  version: 2.1
  status: synced_with_analysis_v2.1
  source_doc: input2/ЦУП_md/ANALYSIS_AS-IS_RCA_и_Сбойные.md
  authority_docs:
    - КД-ДП-Б8.007-05
    - КД-РГ-147(148)-08
    - КД-РИ-Б1.071-06
    - РГ-128-06
    - РД-Б8.003-11
    - РД-Б8.005-09
    - РИ-Б8.014-07
    - РИ-Б8.1.018-06
    - РИ-М1.016-08
    - КД-РД-Б1.041-04  # изм.32 от 24.04.2026 — добавлен в v2.1
  external_triggers:
    - КК62-26  # повестка Комитета по производственной деятельности от 23.04.2026

# ─────────────────────────────────────────────────────────────────────────
# 1. РОЛИ И ПОДРАЗДЕЛЕНИЯ
# ─────────────────────────────────────────────────────────────────────────
roles:
  - id: ROLE-DISP-TsUP
    name: Диспетчер ЦУП
    unit: ЦУП
    decision_points: [A1]
  - id: ROLE-NS-TsUP
    name: НС ЦУП (начальник смены)
    unit: ЦУП
    decision_points: [A2, B1, B2]
  - id: ROLE-HEAD-TsUP
    name: Начальник ЦУП / зам. начальника
    unit: ЦУП
    decision_points: [A3, A4, B2, B4]
  - id: ROLE-MGR-SCHED
    name: Ведущий менеджер по управлению расписанием
    unit: ЦУП
    decision_points: []
    note: |
      v2.1: больше не владелец отдельного DP. Recovery-72ч убрано как отдельный DP B3.
      Менеджер расписания участвует в B3 как один из исполнителей команд НС ЦУП.
  - id: ROLE-NS-OPDO
    name: НС ОПДО САОП ЛД
    unit: ЛД
  - id: ROLE-DONO
    name: ДОНО (диспетчер ООНО)
    unit: ЛД/Хэндлинг
  - id: ROLE-SPiOU
    name: СПиОУ ЛД (служба планирования и обеспечения)
    unit: ЛД
  - id: ROLE-CUTO
    name: ЦУТО ВС / ТД
    unit: ТД
  - id: ROLE-DUTiZ
    name: ДУТиЗ (управление тарифами и загрузкой)
    unit: КД
  - id: ROLE-UTG-DC
    name: ДЦ АО «Ю-Ти-Джи»
    unit: external
    contact:
      phone: "(3452) 281100"
      anchor: КД-РГ-147(148)-08
  # v2.1: новые роли из КД-РД-Б1.041-04 (изм.32)
  - id: ROLE-KC
    name: Контактный центр (КЦ)
    unit: КД
    decision_points: []
    note: владелец АСБ Leonardo и сервиса KYFO; расставляет ремарки DEGR/CVIP/PDTS, контролирует ФАП-82
  - id: ROLE-OKR
    name: ОКР (Отдел контроля регистрации)
    unit: ЛД/Хэндлинг
    decision_points: []
    note: владелец данных DCS Astra и листа трансферных пассажиров
  - id: ROLE-KAE-KLO
    name: КАЭ / КЛО (командир авиаэскадрильи / лётного отряда)
    unit: ЛД
    decision_points: []
    note: согласует префикс t/t* для ВС с двигательными ограничениями (Meridian.OPS)

units:
  - id: UNIT-TsUP
    name: ЦУП — Центр управления полётами
    parent: ЛД
  - id: UNIT-LD
    name: ЛД — Лётный департамент
  - id: UNIT-TD
    name: ТД — Технический департамент
  - id: UNIT-KD
    name: КД — Коммерческий департамент
  - id: UNIT-DONO
    name: Дирекция организации наземного обслуживания
  - id: UNIT-OPiAA
    name: Отдел планирования и анализа авиаперевозок
    note: владелец отчёта UT-DSP.1-06 (РИ-М1.016 §6)

# ─────────────────────────────────────────────────────────────────────────
# 2. DECISION POINTS
# ─────────────────────────────────────────────────────────────────────────
decision_points:
  - id: A1
    cycle: RCA
    actor: ROLE-DISP-TsUP
    decision: Предварительная формулировка причины задержки + IATA-код
    time_window: <=15 мин от планового времени
    anchor: РД-Б8.005-09 §14.2 табл.1
  - id: A2
    cycle: RCA
    actor: ROLE-NS-TsUP
    decision: Окончательная формулировка причины + код AHM 730
    time_window: по смене
    anchor: РД-Б8.005-09 §14.2 шаги 3,6; КД-ДП-Б8.007 §10
  - id: A3
    cycle: RCA
    actor: ROLE-HEAD-TsUP
    decision: Решение о доп. расследовании, эскалация виновникам
    time_window: до 11:00 тюм. ежедневно
    anchor: КД-ДП-Б8.007 §11 табл.1 (ежедневный)
  - id: A4
    cycle: RCA
    actor: ROLE-HEAD-TsUP
    decision: Корректирующие/предупреждающие действия, спец.аудит подрядчика
    time_window: неделя/месяц/год
    anchor: КД-ДП-Б8.007 §11 (глубокий); РИ-М1.016 §9; РД-Б8.003-11 §8.4
  # v2.1: B-цикл переинтерпретирован как «Оперативное управление регулярностью»
  # (ранее в v1 — Disrupt / Сбойная ситуация). Триггер — каждое отклонение в ПП.
  - id: B1
    cycle: OperationalRegularity
    actor: ROLE-DISP-TsUP
    co_actors: [ROLE-CUTO, ROLE-NS-OPDO, ROLE-SPiOU, ROLE-DONO]
    decision: Сбор оперативной картины по конкретному отклонению
    trigger: каждое прогнозируемое или фактическое отклонение в плане полётов
    time_window: <=30 мин от получения информации
    anchor: КД-ДП-Б8.007 §11 табл.1 (оперативный); РД-Б8.005-09 §14.2 шаг 1
  - id: B2
    cycle: OperationalRegularity
    actor: ROLE-NS-TsUP
    decision: Окончательное решение по отклонению (выбор + обоснование)
    options:
      - Ждать
      - Замена ВС
      - Резервный экипаж
      - Перенос
      - Совмещение
      - Отмена
      - Стыковки пассажиров
      - Запасной а/д
    inputs_v2_1:  # 4 новых входа из КД-РД-Б1.041-04 изм.32
      - SYS-LEONARDO (DEGR/CVIP/PDTS — приоритеты пассажиров)
      - SYS-MER-OPS-TT (флаг t/t* — ограничения двигателей)
      - SYS-KYFO (статусы услуг ФАП-82)
      - SYS-DCS-ASTRA (факт чек-инов, закрытие рейса)
    sla_timers_v2_1:  # триггеры B-петли из изм.32
      - T-6h: расстановка DEGR/CVIP/PDTS в АСБ Leonardo
      - T-3h_or_T-2h: подготовка протокола по трансферным паксам
      - T+1h_after_delay: контроль сервисов ФАП-82 через KYFO
      - flag_tt: фильтр при выборе подмены ВС
    time_window: минуты–часы (для каждого рейса)
    anchor: РД-Б8.005-09 §14.1.3; КД-РД-Б1.041-04 §6, §10–§14, §17 (изм.32)
  - id: B3
    cycle: OperationalRegularity
    actor: ROLE-NS-TsUP
    executors: [ROLE-UTG-DC, ROLE-CUTO, ROLE-SPiOU, ROLE-DONO, ROLE-DUTiZ, ROLE-DISP-TsUP, ROLE-MGR-SCHED]
    decision: Команды исполнителям по регламентированным каналам
    time_window: минуты
    anchor: РД-Б8.005-09 §15.1.3.2.2.1–§15.1.3.2.2.8; КД-РГ-147(148)-08 табл.1–5
  - id: B4
    cycle: OperationalRegularity
    actor: ROLE-NS-TsUP
    escalates_to: ROLE-HEAD-TsUP  # либо начальник ЛД
    decision: Эскалация при превышении компетенции НС ЦУП (иерархическая, не ERP)
    time_window: по факту
    anchor: РД-Б8.005-09 §14.1.4
  # Out-of-scope для v2.1 MVP, но сохранены как ссылки
  - id: B-LEGACY-DISRUPT
    cycle: Disrupt-Legacy
    status: out_of_scope_for_mvp
    actor: ROLE-NS-TsUP
    decision: Присвоение статуса «Сбойная ситуация»
    trigger: ≥10 задержек по одной причине
    anchor: РД-Б8.005-09 §15.1.3.3.2–§15.1.3.3.4
    note: фаза 2 (плейбуки КК62-26 поверх B-петли)
  - id: B-LEGACY-ERP
    cycle: ERP
    status: out_of_scope_for_ai_assistant
    actor: ROLE-HEAD-TsUP
    decision: Эскалация в оперштаб ERP (АНВ / АП)
    anchor: РГ-128-06 §1.1, §5.6–5.7

# ─────────────────────────────────────────────────────────────────────────
# 3. СПРАВОЧНИКИ
# ─────────────────────────────────────────────────────────────────────────

# 3.1 Категории задержек (21 категория, РИ-М1.016-08 §8.1.2)
delay_categories_ri_m1_016:
  scheme: РИ-М1.016-08 §8.1.2
  count: 21
  classes:
    - id: DC-AC
      name: Авиакомпания (внутренние причины)
      example_codes_iata: [PR, MX, FX]
    - id: DC-HND
      name: Наземное обслуживание (хэндлинг)
      example_codes_iata: [GD, GH]
    - id: DC-WX
      name: Метеоусловия
      example_codes_iata: [WO]
    - id: DC-ATC
      name: ОрВД / слоты
      example_codes_iata: [AT]
    - id: DC-PAX
      name: Пассажиры (трансфер, опоздания, медицина)
      example_codes_iata: [PD, PL]
    - id: DC-AIR
      name: Аэропорт (инфраструктура, ВПП)
      example_codes_iata: [AS, AE]
    - id: DC-TECH
      name: Техническое обслуживание ВС
      example_codes_iata: [TD, TM]
    - id: DC-CREW
      name: Экипаж (резерв, раб. время, медотстранение)
      example_codes_iata: [FC]
    - id: DC-FUEL
      name: Топливо
      example_codes_iata: [FS]
    - id: DC-CARGO
      name: Загрузка / груз / NOTOC
      example_codes_iata: [LR]
    - id: DC-CATERING
      name: Бортпитание
      example_codes_iata: [CD]
    - id: DC-CLEAN
      name: Уборка ВС
      example_codes_iata: [CC]
    - id: DC-DICE
      name: Противообледенение
      example_codes_iata: [WI]
    - id: DC-SECURITY
      name: Авиабезопасность
      example_codes_iata: [SA]
    - id: DC-DOCS
      name: Документация (load sheet, дисп.разрешение)
      example_codes_iata: [LD]
    - id: DC-ROUTE
      name: Маршрут / FPL / запасной а/д
      example_codes_iata: [AT]
    - id: DC-SLOT
      name: Слоты ЦБРС / ГЦ ЕС ОрВД
      example_codes_iata: [AT]
    - id: DC-CUSTOMS
      name: Таможня / погранконтроль
      example_codes_iata: [GO]
    - id: DC-BAGS
      name: Багаж (поиск, разногласия)
      example_codes_iata: [LB]
    - id: DC-ROTATION
      name: Связанные задержки (rotation)
      example_codes_iata: [RA]
    - id: DC-OTHER
      name: Прочее
      example_codes_iata: [MI]
  note: |
    Точные коды AHM 730 берутся из КД-ДП-Б8.007 §10. В YAML указаны примерные —
    финальный mapping заполняется на основании актуальной редакции AHM 730.

# 3.2 IATA AHM 730 — справочник кодов (полный заполняется отдельно)
iata_ahm_730:
  source: КД-ДП-Б8.007-05 §10
  storage: внешний справочник (CSV/JSON), импортируется в ИС
  mapping_to_ri_m1_016: см. delay_categories_ri_m1_016.classes[*].example_codes_iata

# 3.2.1 Ремарки приоритетов пассажиров (v2.1, КД-РД-Б1.041-04 изм.32)
passenger_priority_remarks:
  source: КД-РД-Б1.041-04 §10–§14 (изм.32)
  storage: АСБ Leonardo (SYS-LEONARDO)
  remarks:
    - id: REM-DEGR
      name: DEGR
      meaning: пассажир, для которого допустима добровольная замена (downgrade/voluntary denial)
      sla_set_at: T-6h до СОВ
      owner: ROLE-KC
    - id: REM-CVIP
      name: CVIP
      meaning: VIP-уровень или приравненный (требует приоритетного сервиса)
      sla_set_at: T-6h до СОВ
      owner: ROLE-KC
    - id: REM-PDTS
      name: PDTS
      meaning: пассажир с особыми условиями (upgrade/специальный приоритет)
      sla_set_at: T-6h до СОВ
      owner: ROLE-KC

